<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SSO Requests · SplashHub Centre</title>
  <link rel="icon" href="splashtop-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css?v=0.9.1">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="splashtop-icon.png" alt="" width="24" height="24">
      <span class="brand-name">SplashHub <span class="brand-sub">Centre</span></span>
    </div>
    <nav class="topnav" aria-label="Pages">
      <a class="topnav-item" href="/">Logs</a>
      <a class="topnav-item" href="/scans">SOS Scans</a>
      <a class="topnav-item active" href="/sso" aria-current="page">SSO Requests</a>
      <a class="topnav-item" href="/prices">Price Book</a>
      <a class="topnav-item" href="/ask">Ask AI</a>
      <a class="topnav-item" href="/settings">Settings</a>
    </nav>
    <div class="topbar-right">
      <button type="button" class="link-btn" id="signOut" hidden>Sign out</button>
    </div>
  </header>

  <main class="page" id="page" hidden>
    <div class="hdr">
      <div class="hdr-left">
        <h1 class="hdr-title">SSO Requests</h1>
        <div class="hdr-sub">Requests to validate an SSO method: the domain and the DNS TXT record the customer must add. Check DNS shows whether it&rsquo;s there yet.</div>
      </div>
      <div class="hdr-right">
        <span class="stamp" id="stamp"></span>
        <button type="button" class="btn btn-icon" id="refresh" title="Refresh" aria-label="Refresh">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
      </div>
    </div>

    <section class="card filters" aria-label="Actions">
      <form class="frow" id="addForm">
        <label class="sc-label" for="tid">Add a ticket</label>
        <input class="sc-input" id="tid" inputmode="numeric" placeholder="Ticket number, e.g. 48213" autocomplete="off">
        <button type="submit" class="btn btn-primary" id="addBtn">Add</button>
        <span class="sc-msg" id="addMsg" aria-live="polite"></span>
      </form>
      <div class="frow imp-row">
        <span class="sc-label">DNS</span>
        <button type="button" class="btn" id="allBtn"
          title="Look up the TXT record for every request that is not verified yet. Nothing is added to Zendesk.">Check all waiting</button>
        <button type="button" class="btn btn-sm" id="allStop" hidden>Stop</button>
        <span class="sc-msg" id="allMsg" aria-live="polite"></span>
      </div>
      <div class="frow imp-row">
        <span class="sc-label">Past requests</span>
        <button type="button" class="btn" id="impBtn"
          title="Find every past “Here comes a new request to validate SSO method” ticket in Zendesk and list it here. Tickets already listed are skipped.">Import past SSO requests</button>
        <button type="button" class="btn btn-sm" id="impStop" hidden>Stop</button>
        <span class="sc-msg" id="impMsg" aria-live="polite"></span>
      </div>
    </section>

    <section class="card filters" aria-label="Filters">
      <div class="frow">
        <div class="chips" id="chips" role="group" aria-label="Status"></div>
        <div class="search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="q" placeholder="Ticket #, domain, requester or organization" autocomplete="off" spellcheck="false">
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2 class="card-title">Requests</h2>
        <span class="count" id="count"></span>
      </div>
      <div class="table-wrap">
        <table class="runs scans">
          <thead><tr>
            <th>When</th><th>Ticket</th><th>Status</th><th>Domain</th><th>Requester</th><th>Last checked</th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="pager" id="pager" hidden>
        <button type="button" class="btn" id="prev">&larr; Newer</button>
        <span class="pager-txt" id="pagerTxt"></span>
        <button type="button" class="btn" id="next">Older &rarr;</button>
      </div>
    </section>
  </main>

  <!-- One request, in full: a pop-up over the list. -->
  <div class="pn-overlay" id="pnWrap" hidden>
    <aside class="pn" id="panel" role="dialog" aria-modal="true" aria-label="Request details" tabindex="-1">
      <div class="pn-bar">
        <span class="pn-pos" id="pnPos"></span>
        <button type="button" class="btn btn-icon btn-sm" id="pnPrev" title="Previous request (↑)" aria-label="Previous request">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg>
        </button>
        <button type="button" class="btn btn-icon btn-sm" id="pnNext" title="Next request (↓)" aria-label="Next request">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <button type="button" class="btn btn-icon btn-sm" id="pnClose" title="Close (Esc)" aria-label="Close">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="pn-body" id="detail"></div>
    </aside>
  </div>

  <script src="sso.js?v=0.7.3"></script>
</body>
</html>
