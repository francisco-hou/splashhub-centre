<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Price Book · SplashHub Centre</title>
  <link rel="icon" href="splashtop-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css?v=0.9.1">
  <link rel="stylesheet" href="prices.css?v=0.9.4">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="splashtop-icon.png" alt="" width="24" height="24">
      <span class="brand-name">SplashHub <span class="brand-sub">Centre</span></span>
    </div>
    <nav class="topnav" aria-label="Pages">
      <a class="topnav-item" href="/">Logs</a>
      <a class="topnav-item" href="/scans">SOS Scans</a>
      <a class="topnav-item" href="/sso">SSO Requests</a>
      <a class="topnav-item active" href="/prices" aria-current="page">Price Book</a>
      <a class="topnav-item" href="/ask">Ask AI</a>
      <a class="topnav-item" href="/settings">Settings</a>
    </nav>
    <div class="topbar-right">
      <button type="button" class="link-btn" id="signOut" hidden>Sign out</button>
    </div>
  </header>

  <!-- SplashHub's Pricebook (pricebook.js, unchanged), on a SplashHub Centre page. -->
  <main class="page" id="page" hidden>
    <div id="pagePricebook">
      <div class="hdr">
        <div class="hdr-left">
          <h1 class="hdr-title">Price Book</h1>
          <div class="hdr-sub">List pricing in local currency, from splashtop.com &mdash; the same price book as SplashHub in Zendesk.</div>
        </div>
        <div class="hdr-right">
          <span id="pbUpdated" class="stamp"></span>
          <input id="pbSearch" class="pg-filter" type="search" autocomplete="off" placeholder="Filter plans…" aria-label="Filter plans">
          <button id="pbRefresh" type="button" class="btn">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12a9 9 0 1 1-2.64-6.36"></path><polyline points="21 3 21 9 15 9"></polyline>
            </svg>
            Refresh
          </button>
        </div>
      </div>
      <div id="pbError" class="pb-err" style="display:none;"></div>
      <div id="pbNote" class="footnote" style="display:none;"></div>
      <div id="pbBody"></div>
    </div>
  </main>

  <div id="pbCalcOverlay" class="cf-overlay" style="display:none;">
    <div class="cf-modal calc-modal" role="dialog" aria-modal="true" aria-labelledby="pdName">
      <div>
        <span id="pdName"></span>
        <span id="pdUnit"></span>
      </div>
      <div class="calc-inputs">
        <label class="calc-field">
          <span class="calc-label">Endpoints</span>
          <input id="pdCount" type="number" min="1" step="1" value="100" class="calc-input mono">
        </label>
        <label class="calc-field">
          <span class="calc-label">Market</span>
          <select id="pdMarket" class="calc-input"></select>
        </label>
      </div>
      <div id="pdBand" class="calc-band" style="display:none;"></div>
      <div id="pdOut" class="calc-out"></div>
      <div id="pdNote" class="calc-note" style="display:none;"></div>
      <div id="pdBands" class="calc-bands"></div>
      <div class="cf-actions">
        <button type="button" class="cf-btn" id="pdClose">Close</button>
      </div>
    </div>
  </div>

  <script src="prices.js?v=0.9.1"></script>
  <script src="pricebook.js?v=0.9.2"></script>
  <script>
    // Same session as the other pages; then hand SplashHub's Pricebook its client.
    fetch('/api/session', { credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (s) {
      if (s.required && !s.authed) { location.href = '/?next=/prices'; return; }
      document.getElementById('signOut').hidden = !s.required;
      document.getElementById('page').hidden = false;
      PricebookPage.boot(window.CentrePriceClient);
    });
    document.getElementById('signOut').addEventListener('click', function () {
      fetch('/logout', { method: 'POST', credentials: 'same-origin' }).then(function () { location.href = '/'; });
    });
  </script>
</body>
</html>
