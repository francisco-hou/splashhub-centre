  <!-- SplashHub's Pricebook (pricebook.js, unchanged), on a SplashHub Centre page. -->
  <main class="page" id="page" hidden>
    <div id="pagePricebook">
      <div class="hdr">
        <div class="hdr-left">
          <h1 class="hdr-title">PriceBook</h1>
          <div class="hdr-sub">List pricing in local currency, from splashtop.com &mdash; the same PriceBook as SplashHub in Zendesk. Ask the AI for a plan and a quote.</div>
        </div>
        <div class="hdr-right">
          <span id="pbUpdated" class="stamp"></span>
          <input id="pbSearch" class="pg-filter" type="search" autocomplete="off" placeholder="Filter plans…" aria-label="Filter plans">
          <button id="aiOpen" type="button" class="btn btn-primary" aria-expanded="false" aria-controls="aiPanel">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 4.6L18.5 9l-4.6 1.9L12 15.5l-1.9-4.6L5.5 9l4.6-1.4z"/><path d="M19 15l.8 2 2.2.8-2.2.8L19 21l-.8-2.4L16 17.8l2.2-.8z"/></svg>
            AI
          </button>
          <button id="pbRefresh" type="button" class="btn">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12a9 9 0 1 1-2.64-6.36"></path><polyline points="21 3 21 9 15 9"></polyline>
            </svg>
            Refresh
          </button>
        </div>
      </div>
      <div id="pbError" class="pb-err" style="display:none;"></div>
      <div id="pbNote" class="footnote" style="display:none;"></div>
      <div id="pbBody"></div>
    </div>
  </main>

  <!-- The AI, about plans and prices: the same chat as the AI page, in a side panel. -->
  <aside class="ai-drawer" id="aiPanel" aria-label="AI: plans and prices" hidden>
    <div class="ai-drawer-bar">
      <span class="ai-drawer-t">AI &middot; plans and prices</span>
      <button type="button" class="btn btn-sm" id="aiNew">New</button>
      <button type="button" class="btn btn-icon btn-sm" id="aiClose" aria-label="Close">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="ai-drawer-body" id="aiChat"></div>
  </aside>

  <div id="pbCalcOverlay" class="cf-overlay" style="display:none;">
    <div class="cf-modal calc-modal" role="dialog" aria-modal="true" aria-labelledby="pdName">
      <div>
        <span id="pdName"></span>
        <span id="pdUnit"></span>
      </div>
      <div class="calc-inputs">
        <label class="calc-field">
          <span class="calc-label">Endpoints</span>
          <input id="pdCount" type="number" min="1" step="1" value="100" class="calc-input mono">
        </label>
        <label class="calc-field">
          <span class="calc-label">Market</span>
          <select id="pdMarket" class="calc-input"></select>
        </label>
      </div>
      <div id="pdBand" class="calc-band" style="display:none;"></div>
      <div id="pdOut" class="calc-out"></div>
      <div id="pdNote" class="calc-note" style="display:none;"></div>
      <div id="pdBands" class="calc-bands"></div>
      <div class="cf-actions">
        <button type="button" class="cf-btn" id="pdClose">Close</button>
      </div>
    </div>
  </div>

  <script src="prices.js?v=1.1.0"></script>
  <script src="pricebook.js?v=0.9.2"></script>
  <script src="aichat.js?v=1.1.0"></script>
  <script>
    // Same session as the other pages; then hand SplashHub's Pricebook its client.
    fetch('/api/session', { credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (s) {
      document.getElementById('signOut').hidden = !(s.required && s.authed);
      document.getElementById('page').hidden = false;
      PricebookPage.boot(window.CentrePriceClient);
    });
    // The AI side panel: mounted the first time it opens.
    var aiChat = null;
    function aiShow(open) {
      var panel = document.getElementById('aiPanel');
      panel.hidden = !open;
      document.body.classList.toggle('ai-open', open);
      document.getElementById('aiOpen').setAttribute('aria-expanded', open);
      if (open && !aiChat) {
        aiChat = AiChat.mount(document.getElementById('aiChat'), {
          focus: 'prices',
          placeholder: 'Ask about plans, prices or a quote\u2026',
          suggestions: ['Best plan for 3 technicians, 200 users and 10 devices?',
                        'Attended support only, for 5 technicians: what do we need?',
                        'How much for 12 Pro users in the UK?',
                        'What is the difference between SOS+10 and SOS+300?',
                        'Quote 150 endpoints of AEM plus Antivirus in Japan']
        });
      }
      if (open) aiChat.focus();
    }
    document.getElementById('aiOpen').addEventListener('click', function () { aiShow(document.getElementById('aiPanel').hidden); });
    document.getElementById('aiClose').addEventListener('click', function () { aiShow(false); });
    document.getElementById('aiNew').addEventListener('click', function () { if (aiChat) aiChat.reset(); });
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape' && !document.getElementById('aiPanel').hidden &&
          document.getElementById('pbCalcOverlay').style.display === 'none') aiShow(false);
    });
    document.getElementById('signOut').addEventListener('click', function () {
      fetch('/logout', { method: 'POST', credentials: 'same-origin' }).then(function () { location.reload(); });
    });
  </script>
