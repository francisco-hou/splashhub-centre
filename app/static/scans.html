<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SOS Scans · SplashHub Centre</title>
  <link rel="icon" href="splashtop-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="splashtop-icon.png" alt="" width="24" height="24">
      <span class="brand-name">SplashHub <span class="brand-sub">Centre</span></span>
    </div>
    <nav class="topnav" aria-label="Pages">
      <a class="topnav-item" href="/">Logs</a>
      <a class="topnav-item active" href="/scans" aria-current="page">SOS Scans</a>
    </nav>
    <div class="topbar-right">
      <button type="button" class="link-btn" id="signOut" hidden>Sign out</button>
    </div>
  </header>

  <main class="page" id="page" hidden>
    <div class="hdr">
      <div class="hdr-left">
        <h1 class="hdr-title">SOS Scans</h1>
        <div class="hdr-sub">Custom SOS package requests, brand-reviewed when they arrive. Results stay here &mdash; nothing is written to Zendesk.</div>
      </div>
      <div class="hdr-right">
        <!-- The AI review switch: off until the team decides. Applies only to
             requests that arrive while it is on. -->
        <label class="aisw" id="aiSwitch" title="">
          <span class="aisw-txt">AI review</span>
          <span class="aisw-sw"><input type="checkbox" id="aiToggle" aria-describedby="aiState"><span class="aisw-track"></span></span>
          <span class="aisw-state" id="aiState">…</span>
        </label>
        <span class="stamp" id="stamp"></span>
        <button type="button" class="btn btn-icon" id="refresh" title="Refresh" aria-label="Refresh">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
      </div>
    </div>

    <div class="note warn-note" id="setup" hidden></div>

    <section class="card filters" aria-label="Scan a ticket">
      <form class="frow" id="scanForm">
        <label class="sc-label" for="tid">Scan a ticket</label>
        <input class="sc-input" id="tid" inputmode="numeric" placeholder="Ticket number, e.g. 48213" autocomplete="off">
        <label class="sc-check"><input type="checkbox" id="force"> Re-scan even if already reviewed</label>
        <button type="submit" class="btn btn-primary" id="scanBtn">Scan now</button>
        <span class="sc-msg" id="scanMsg" aria-live="polite"></span>
      </form>
      <!-- Past requests: found by SplashHub Centre's own Zendesk search; listed
           at their original dates, never AI-reviewed. Safe to press again. -->
      <div class="frow imp-row">
        <span class="sc-label">Past requests</span>
        <button type="button" class="btn" id="impBtn"
          title="Find every past “New SOS package created by…” ticket in Zendesk and list it here, with copies of its images. No AI review. Tickets already listed are skipped.">Import past SOS requests</button>
        <span class="sc-msg" id="impMsg" aria-live="polite"></span>
      </div>
    </section>

    <section class="card filters" aria-label="Filters">
      <div class="frow">
        <div class="chips" id="verdicts" role="group" aria-label="Verdict"></div>
        <div class="search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="q" placeholder="Ticket #, subject, creator or organization" autocomplete="off" spellcheck="false">
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2 class="card-title">Scans</h2>
        <span class="count" id="count"></span>
      </div>
      <div class="table-wrap">
        <table class="runs scans">
          <thead><tr>
            <th>When</th><th>Ticket</th><th>Verdict</th><th>Subject</th><th>Creator</th><th>Started by</th><th class="r">Est. cost</th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="pager" id="pager" hidden>
        <button type="button" class="btn" id="prev">&larr; Newer</button>
        <span class="pager-txt" id="pagerTxt"></span>
        <button type="button" class="btn" id="next">Older &rarr;</button>
      </div>
    </section>
  </main>

  <script src="scans.js"></script>
</body>
</html>
