app:
  # NOTE: app.name becomes the URL's first label and can never be changed once
  # the app is created on Spluki. The page itself is branded "SplashHub Centre";
  # that comes from the page, not from this name.
  name: splashhub
  summary: The SplashHub run log -- every AI and tool run from the SplashHub Zendesk app, with cost and usage by tool and agent.
  description: |
    SplashHub Centre: the Spluki home for SplashHub's run log. One row per run (who ran
    which tool, when, on which model, with tokens and estimated cost), filterable by
    period, tool, agent and model, with per-day and per-tool charts and CSV export.
    Logs and Settings are admin-only behind ADMIN_PASSWORD; the other pages are open to the team. Also reviews
    Custom SOS package requests (brand impersonation check on the thumbnails, Claude
    vision) when a Zendesk trigger sends them; results are kept here, and a review is
    added to the ticket as an internal note only when an agent presses that button.
    SSO Requests: lists SSO method validation requests and, on an agent's press, looks up
    the customer's DNS TXT record to see whether it has been added.
    Zendesk Tickets: 2026's Zendesk tickets (subject, tags, status, requester, the whole conversation) kept so the AI page can
    count, group and find similar cases and their fixes; read-only, never anything per support agent.
    Knowledge Base: the Zendesk Help Center's articles (read-only), searchable, with votes, languages and the tickets
    that link each one. PO Requests: every ticket with a "Provision Details" order, all years, with the order read out
    and the ticket's conversation (agents' names removed). Customers: one customer's tickets, PO requests, Custom SOS
    packages and SSO requests on one page, with a Spark summary.
  type: web-service
  runtime: docker
  port: 8795
  health_check_path: /health
  stage: in_development
  version: "0.12.12"

deployment:
  environment: dev
  visibility: internal
  instance_size: small

secrets:
  ADMIN_PASSWORD:
    name: ADMIN_PASSWORD
    required: true
  # Shared with SplashHub (its secure "Run log secret" setting): every post to the
  # webhook must carry it in X-SplashHub-Key, or the run is discarded.
  RUNLOG_SECRET:
    name: RUNLOG_SECRET
    required: true
  # SOS package scans (sosscan.py / zendesk.py). Zendesk access (reads; one write:
  # the internal note an agent asks for); not
  # required, so a release never waits on them -- the SOS Scans page lists what's missing.
  ZENDESK_EMAIL:
    name: ZENDESK_EMAIL
    required: false
  ZENDESK_API_TOKEN:
    name: ZENDESK_API_TOKEN
    required: false
  # The signing secret Zendesk shows on the webhook it calls; verifies each trigger call.
  ZENDESK_WEBHOOK_SECRET:
    name: ZENDESK_WEBHOOK_SECRET
    required: false
  # Teams notifications (notify.py): the channel's "Send webhook alerts to a channel"
  # workflow link. Anyone with it can post to the channel, so it lives only here.
  TEAMS_WEBHOOK_URL:
    name: TEAMS_WEBHOOK_URL
    required: false

permissions:
  - service: SPLUKI_POSTGRES
    reason: The run log itself -- one row per SplashHub run; the container filesystem is wiped on redeploy
  - service: SPLUKI_STORAGE
    reason: Image copies that earlier versions kept for Custom SOS package tickets, still shown on the SOS Scans page. New requests no longer store copies (images show from Zendesk).
  - service: SPLUKI_WEBHOOK
    reason: Zendesk SplashHub Logs -- SplashHub (inside Zendesk) cannot reach a Spluki app directly; it posts each run to the platform's public intake and this app picks them up
  - service: OUTBOUND_HTTP
    reason: Zendesk API for the Custom SOS package scan -- reads the ticket, its comments and the thumbnails it reviews (zdusercontent.com). One write, only when an agent presses "Add as internal note" on a reviewed request - the review is added to that ticket as an internal (agent-only) note.
  # The AI review itself stays off until someone turns on the switch on the SOS
  # Scans page; declaring the grant only means no release is needed then.
  - service: CUSTOM_AI
    reason: Team Anthropic key for the SOS package scan (Claude vision, same policy and model as SplashHub's sidebar scan)
  # Spark: Splashtop's own AI (spark.py). Approved and filled in by an
  # administrator (AI_SPARK_BASE_URL, AI_SPARK_API_KEY); the dashboard's spike
  # summary and lookalike names use it. Same reason as the approved grant.
  - service: SPLUKI_AI_SPARK
    reason: Zendesk Ticket AI Review
